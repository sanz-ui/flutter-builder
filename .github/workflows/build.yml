name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'Nama file ZIP (contoh: BASE HOLLOW EXECUTION.zip)'
        required: true
        default: 'BASE HOLLOW EXECUTION.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o "${{ github.event.inputs.zip_file }}" -d project

      - name: Find Flutter root
        id: find_root
        run: |
          ROOT=$(find project -name "pubspec.yaml" -type f | head -1 | xargs dirname)
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Flutter root: $ROOT"

      - name: Flutter pub get
        working-directory: ${{ steps.find_root.outputs.root }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_root.outputs.root }}
        run: flutter build apk --release

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find project -name "app-release.apk" -type f | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: ${{ steps.find_apk.outputs.apk }}
